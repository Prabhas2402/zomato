apiVersion: v1
kind: Service
metadata:
  name: zomato-loadbalancer
spec:
  type: LoadBalancer
  selector:
    app: zomato
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: zomato-nodeport
spec:
  type: NodePort
  selector:
    app: zomato
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30001
